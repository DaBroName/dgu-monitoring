version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: dgu-postgres
    environment:
      POSTGRES_DB: dgu_monitoring
      POSTGRES_USER: dgu
      POSTGRES_PASSWORD: dgu_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgu -d dgu_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dgu-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: